# SonarCloud should analyze hand-written application code and keep generated
# Prisma artifacts and database migration scripts out of quality metrics.
# Automatic Analysis mirrors the CPD exclusions in SonarCloud project settings;
# enter each wildcard as a separate exclusion there.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/generated/prisma/**,prisma/migrations/**
sonar.cpd.exclusions=src/generated/prisma/**,prisma/migrations/**,tests/**
