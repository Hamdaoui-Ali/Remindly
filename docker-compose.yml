services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: remindly
      POSTGRES_PASSWORD: remindly
      POSTGRES_DB: remindly
    ports:
      - "5432:5432"
    volumes:
      - remindly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remindly -d remindly"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  remindly-postgres-data:
